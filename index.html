<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--txt);user-select:none}
#app{max-width:520px;margin:0 auto;padding:14px}

.center{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}

.btn span{font-size:1.1rem;font-weight:bold}
.btn:active,.card:active{transform:translateY(4px)}
.play{font-size:1.6rem;padding:18px 36px;min-height:0;background:#48bb78;border-radius:40px}

.card.big{min-height:110px}
.sw{display:block;width:62px;height:62px;border-radius:50%;border:3px solid #cbd5e0}

.stage .big{font-size:6.5rem;line-height:1.1}.stage .sw{width:120px;height:120px}
.stage small{font-size:1.5rem;color:var(--ink);font-weight:bold}
.dots{font-size:1.7rem;word-break:break-all}
.hint{animation:pulse .9s infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 6px #faf089}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#ov{position:fixed;inset:0;background:rgba(205,238,253,.97);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
.panel{background:#fff;border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:1.05rem}
.row input[type=text],.row select{font-size:1rem;padding:8px;border-radius:10px;border:2px solid #cbd5e0;max-width:150px}
.row input[type=checkbox]{width:26px;height:26px}
.pbtn{border:none;border-radius:14px;padding:12px 18px;font-size:1rem;background:#2b6cb0;color:#fff;font-family:inherit}
.tips li{margin-bottom:6px;line-height:1.6}
#app{padding-bottom:96px}
#nb{position:fixed;left:0;right:0;bottom:0;display:none;gap:6px;overflow-x:auto;background:#fff;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -3px 10px rgba(0,0,0,.12);z-index:5}
#nb button{flex:0 0 auto;min-width:64px;border:none;background:none;border-radius:14px;padding:4px 6px;font-size:1.5rem;font-family:inherit}
#nb button span{display:block;font-size:.65rem;color:var(--txt)}
#nb button.on{background:#e6f4ff}
.stage .big svg{width:120px;height:120px}.card svg{width:62px;height:62px}
.eye,.ear{transform-box:fill-box}.eye{transform-origin:center;animation:blink 4s infinite}.ear{transform-origin:bottom center;animation:ear 5s ease-in-out infinite}.ear.e2{animation-delay:1.2s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes ear{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-7deg)}94%{transform:rotate(5deg)}}

input,select{user-select:text;-webkit-user-select:text}#tt{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#2d3748;color:#fff;padding:10px 18px;border-radius:20px;z-index:20;display:none;font-size:1rem;white-space:nowrap}.bdw{position:relative;overflow:hidden;min-height:70vh;display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:90px}
.cd{cursor:pointer}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl 1.8s ease-in-out infinite;transition:opacity .5s,transform .5s}
@keyframes fl{50%{transform:scale(1.07,.95)}}.off .fl{opacity:0;transform:scale(.2)}.smk{opacity:0}.off .smk{animation:smk 1.6s ease-out}
@keyframes smk{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-26px)}}
.cf{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:cf 4s linear forwards}@keyframes cf{to{transform:translateY(110vh) rotate(540deg)}}
.wd{position:absolute;top:34%;right:-60px;font-size:3rem;animation:wd 1s ease-out forwards}@keyframes wd{to{transform:translateX(-90vw)}}
@media (prefers-reduced-motion:reduce){.fl,.cf,.smk,.wd{animation:none}}
