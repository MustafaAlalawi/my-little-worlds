name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup project
        run: |
          mkdir www
          cp -r index.html sw.js manifest.webmanifest sounds.json sounds icon-*.png www/
          cp 404.html www/ || true
          echo '{"name":"little-world","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"com.mustafa.littleworld","appName":"عالمي الصغير","webDir":"www"}' > capacitor.config.json
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" /><application#' android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do for n in ic_launcher ic_launcher_round; do cp icon-192.png $d/$n.png; done; done
          npx cap sync android
      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create build-${{ github.run_number }} android/app/build/outputs/apk/debug/app-debug.apk --title "APK ${{ github.run_number }}" --notes "app"
